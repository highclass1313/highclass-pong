name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Unit + Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run game logic tests
        run: npm run test:js

      - name: Compile contract
        run: node scripts/compile.js

      - name: Run contract tests
        run: npx hardhat test --no-compile

  audit:
    name: Contract Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci
          pip install slither-analyzer

      - name: Run Slither
        # Informational findings (timestamp / low-level-calls) are known false
        # positives on this contract; fail only on medium+ severity.
        run: slither contracts/HighClassPong.sol --fail-medium
        continue-on-error: true

      - name: Run solhint
        run: npx solhint contracts/HighClassPong.sol
        continue-on-error: true
